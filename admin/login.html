<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · KisahAbadi</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Inter:wght@400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="../assets/style.css"></head><body style="background:var(--bg2);display:grid;place-items:center;min-height:100vh"><form class="card frm" id="f" style="width:min(380px,92vw)"><img src="../assets/logo.png" alt="KisahAbadi" style="width:200px;margin:0 auto"><p class="c mut" style="margin:0">Admin Panel</p><div id="err"></div><label>Email<input name="e" type="email" required autofocus></label><label>Password<input name="p" type="password" required></label><button class="btn">LOGIN</button></form><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/config.js"></script><script src="../js/lib.js"></script>
<script>(async()=>{if((await sb.auth.getSession()).data.session)location.href='index.html';
$('#f').onsubmit=async e=>{e.preventDefault();const f=e.target,r=await sb.auth.signInWithPassword({email:f.e.value.trim(),password:f.p.value});
if(r.error)$('#err').innerHTML='<div class="alert">Email atau password salah.</div>';else location.href='index.html'}})()</script></body></html>
